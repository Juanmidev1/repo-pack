[package]
name = "repo-pack"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
ignore = "0.4.34"
regex = "1.13.2"

[dev-dependencies]
tempfile = "3.27.0"

# Keep the release binary small (under 3 MB)
[profile.release]
strip = true
lto = true
codegen-units = 1
