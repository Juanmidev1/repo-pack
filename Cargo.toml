[package]
name = "repo-pack"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
ignore = "0.4.34"
regex = "1.13.2"
tempfile = "3.27.0"
tree-sitter = { version = "0.27.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }


# Keep the release binary small (under 3 MB)
[profile.release]
strip = true
lto = true
codegen-units = 1

[features]
default = ["skeleton"]
# Tree-sitter grammars add several MB; build with --no-default-features for the minimal binary
skeleton = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
]
