name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: repo-pack
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: repo-pack
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: repo-pack.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          archive="repo-pack-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$archive"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" README.md LICENSE "$archive/"
          tar -czf "$archive.tar.gz" "$archive"
          echo "ARCHIVE=$archive.tar.gz" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
